<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17365d">
<title>مفردات المرتب | Alpha Ceuticals</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{font-family:Cairo,Tahoma,sans-serif;color:#17243a;background:#f3f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{background:#17365d;color:white;padding:18px max(20px,calc((100vw - 1000px)/2));box-shadow:0 3px 12px #0f274014}header h1{font-size:21px;margin:0}header p{font-size:13px;color:#e1e9f4;margin:3px 0 0}main{max-width:1000px;margin:28px auto;padding:0 16px 44px}.panel{background:#fff;border:1px solid #dbe2ec;border-radius:14px;padding:20px;box-shadow:0 4px 18px #142b460a;margin-bottom:16px}.login{max-width:480px;margin:42px auto}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;font:inherit;padding:9px 12px;border:1px solid #dbe2ec;border-radius:8px;background:#fff;color:#17243a}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}button{font:inherit;border:1px solid #17365d;border-radius:8px;padding:9px 15px;background:#17365d;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:white;color:#17365d}button:disabled{opacity:.5;cursor:wait}.muted{color:#637187}.hide{display:none!important}.error{color:#a61b1b;background:#fde8e8;padding:10px 13px;border-radius:8px;margin-top:12px}.slip{max-width:720px;margin:0 auto;background:#fff;border:1px solid #dbe2ec;border-top:6px solid #17365d;border-radius:12px;padding:22px}.sliphead{text-align:center;border-bottom:1px solid #dbe2ec;padding-bottom:14px}.sliphead h2{color:#17365d;margin:0}.sliphead p{margin:3px;color:#637187}.ident{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin:15px 0}.ident div,.total{background:#e8eef6;padding:11px;border-radius:9px}.ident span,.total span{display:block;color:#637187;font-size:13px}.ident strong{font-size:17px}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.total strong{display:block;color:#17365d;font-size:18px;overflow-wrap:anywhere}.section-title{font-size:16px;color:#17365d;margin:18px 0 7px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}.detail{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf0f4;padding:7px 2px}.detail span{color:#637187}.detail b{font-variant-numeric:tabular-nums;text-align:left;direction:ltr}.actions{justify-content:center;margin-top:18px}.foot{text-align:center;color:#7a8798;font-size:12px;margin-top:18px}@media(max-width:560px){main{margin:16px auto;padding:0 11px 30px}.panel{padding:15px}.slip{padding:14px}.totals{grid-template-columns:1fr}.details{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Alpha Ceuticals | مفردات المرتب</h1><p>صفحة داخلية لمسؤولي الرواتب</p></header>
<main>
  <section id="loginPanel" class="panel login"><h2>دخول صفحة القسائم</h2><p class="muted">استخدم الحساب المخصص لهذه الصفحة.</p><form id="loginForm"><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" style="width:100%;margin-top:14px">دخول</button><div id="loginError" class="error hide" role="alert"></div></form></section>
  <section id="appPanel" class="hide">
    <div class="panel row between"><div><strong id="adminName">مستخدم القسائم</strong><div class="muted">اختر الشهر ثم الفرع ثم الموظف لعرض القسيمة.</div></div><button id="logout" class="secondary">تسجيل الخروج</button></div>
    <div class="panel"><div class="filters"><div class="field"><label for="monthSelect">شهر المرتب</label><select id="monthSelect" disabled><option value="">جاري التحميل…</option></select></div><div class="field"><label for="branchSelect">الفرع</label><select id="branchSelect" disabled><option value="">اختار الشهر أولًا</option></select></div><div class="field"><label for="employeeSelect">الموظف</label><select id="employeeSelect" disabled><option value="">اختار الفرع أولًا</option></select></div></div><div id="dataError" class="error hide" role="alert"></div><p id="hint" class="muted" style="text-align:center;margin:20px 0 0">اختار شهر المرتب لبدء البحث.</p></div>
    <section id="slipPanel" class="panel hide"><article id="slipCard" class="slip"></article><div class="row actions"><button id="downloadBtn">تنزيل صورة PNG</button><button id="shareBtn" class="secondary">مشاركة الصورة</button></div></section>
  </section>
</main>
<script>
const SUPABASE_URL='https://reubtwlfjbwqfdbolzgx.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJldWJ0d2xmamJ3cWZkYm9semd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMjU0MDMsImV4cCI6MjEwODcwMTQwM30.qwawzY613Rf9xdbqk2Qqg2IHPgJYXN0GmxN9ViC4ZLQ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);const money=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true});
const num=x=>Number.isFinite(Number(x))?Number(x):0;const fmt=x=>money.format(num(x));let rows=[],selected=null,monthKey='';
const labels={branch:'الفرع',t:'الفئة',h:'الساعات',days:'أيام الحضور',abs:'غياب بدون إذن',hol:'الإجازات الرسمية',ot:'الساعات الإضافية',late:'التأخيرات',penalties:'أيام الجزاءات',disc:'إجمالي الخصم',rate:'قيمة الساعة',hr:'سعر الساعة',trips:'عدد التحويلات',tr:'سعر التحويلة',orders:'عدد الأوردرات',or:'سعر الأوردر',allow:'العدية',adv:'السلف',sh:'العجز',ins:'التأمينات',bonus:'الحافز',pm:'طريقة القبض'};
const counts=new Set(['h','days','abs','hol','ot','late','penalties','trips','orders']);
function showError(msg){$('dataError').textContent=msg;$('dataError').classList.remove('hide')}function clearError(){$('dataError').classList.add('hide')}
function option(select,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o)}
async function loadMonths(){clearError();const s=$('monthSelect');s.innerHTML='';option(s,'','اختار شهرًا');try{const {data,error}=await db.rpc('payslip_share_months');if(error)throw error;for(const m of data||[])option(s,m.month_key,m.month_key);s.disabled=false;if(!data?.length){$('hint').textContent='لا توجد شهور محفوظة.';return}const latest=data[0].month_key;s.value=latest;await loadMonth(latest)}catch(e){showError('تعذر تحميل الشهور المتاحة لهذا الحساب.');console.error(e)}}
function clearSlip(message='اختار شهر المرتب لبدء البحث.'){selected=null;$('slipPanel').classList.add('hide');$('hint').textContent=message;$('hint').classList.remove('hide')}
async function loadMonth(key){clearError();monthKey=key;rows=[];clearSlip('جاري تحميل الشهر…');const b=$('branchSelect'),e=$('employeeSelect');b.innerHTML='';e.innerHTML='';option(b,'','اختار فرعًا');option(e,'','اختار موظفًا');b.disabled=true;e.disabled=true;if(!key)return clearSlip();try{const {data,error}=await db.rpc('payslip_share_branches',{p_month_key:key});if(error)throw error;const branches=(data||[]).map(x=>x.branch).filter(Boolean);for(const x of branches)option(b,x,x);b.disabled=false;$('hint').textContent=branches.length?`عدد الفروع في هذا الشهر: ${branches.length}`:'لا توجد فروع في هذا الشهر.'}catch(err){showError('تعذر تحميل بيانات الشهر.');clearSlip('تعذر تحميل الشهر.');console.error(err)}}
async function loadEmployees(branch){const e=$('employeeSelect');e.innerHTML='';option(e,'','اختار موظفًا');e.disabled=true;rows=[];clearSlip(branch?'جاري تحميل موظفي الفرع…':'اختار الفرع أولًا.');if(!branch)return;try{const {data,error}=await db.rpc('payslip_share_branch_rows',{p_month_key:monthKey,p_branch:branch});if(error)throw error;rows=data||[];rows.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ar'));for(const p of rows){const value=String(p.code??'')+'|'+String(p.name??'');option(e,value,`${p.name||'بدون اسم'}${p.code?` — ${p.code}`:''}`)}e.disabled=false;$('hint').textContent=rows.length?`عدد الموظفين في الفرع: ${rows.length}`:'لا يوجد موظفون في هذا الفرع لهذا الشهر.'}catch(err){showError('تعذر تحميل موظفي الفرع.');console.error(err)}}
function itemHTML(label,value,isCount=false){const div=document.createElement('div');div.className='detail';const l=document.createElement('span');l.textContent=label;const v=document.createElement('b');v.textContent=isCount?fmt(value):fmt(value)+' ج.م';div.append(l,v);return div}
function renderSlip(o){selected=o;$('hint').classList.add('hide');$('slipPanel').classList.remove('hide');const card=$('slipCard');card.replaceChildren();const header=document.createElement('div');header.className='sliphead';const title=document.createElement('h2');title.textContent='مفردات المرتب';const brand=document.createElement('p');brand.textContent='Alpha Ceuticals';header.append(title,brand);card.append(header);
 const ident=document.createElement('div');ident.className='ident';for(const [l,v] of [['الشهر',monthKey],['اسم الموظف',o.name||'—'],['كود الموظف',o.code||'—'],['الفرع',o.branch||'—']]){const box=document.createElement('div'),sp=document.createElement('span'),st=document.createElement('strong');sp.textContent=l;st.textContent=v;box.append(sp,st);ident.append(box)}card.append(ident);
 const totals=document.createElement('div');totals.className='totals';for(const [l,v] of [['إجمالي الراتب',o.tot]]){const box=document.createElement('div'),sp=document.createElement('span'),st=document.createElement('strong');box.className='total';sp.textContent=l;st.textContent=fmt(v)+' ج.م';box.append(sp,st);totals.append(box)}card.append(totals);
 const type=document.createElement('p');type.className='muted';type.textContent=`الفئة: ${o.t==='d'?'مندوب':o.t==='s'?'مساعد':'—'}${o.pm?`  •  طريقة القبض: ${o.pm}`:''}`;card.append(type);
 const detailKeys=Object.keys(labels).filter(k=>o[k]!==undefined&&o[k]!==null&&o[k]!==''&&k!=='branch'&&k!=='t'&&k!=='pm');const h=document.createElement('h3');h.className='section-title';h.textContent='تفاصيل المرتب';card.append(h);const grid=document.createElement('div');grid.className='details';for(const k of detailKeys)grid.append(itemHTML(labels[k],o[k],counts.has(k)));card.append(grid);const foot=document.createElement('div');foot.className='foot';foot.textContent='مفردات مرتب داخلية — Alpha Ceuticals';card.append(foot)}
async function authorizedShareUser(){const {data:{user}}=await db.auth.getUser();if(!user)return null;const {data,error}=await db.rpc('payslip_share_profile');if(error||!data?.allowed)return null;return user}
async function showApp(){const user=await authorizedShareUser();if(!user){await db.auth.signOut();$('appPanel').classList.add('hide');$('loginPanel').classList.remove('hide');$('loginError').textContent='هذا الحساب غير مفعّل لصفحة القسائم.';$('loginError').classList.remove('hide');return false}$('loginPanel').classList.add('hide');$('appPanel').classList.remove('hide');$('adminName').textContent=`مرحبًا، ${user.email||'مستخدم القسائم'}`;await loadMonths();return true}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').classList.add('hide');$('loginBtn').disabled=true;try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await showApp()}catch(err){$('loginError').textContent='تعذر الدخول. تأكد من بيانات مسؤول الرواتب.';$('loginError').classList.remove('hide');console.error(err)}finally{$('loginBtn').disabled=false}});
$('monthSelect').addEventListener('change',e=>loadMonth(e.target.value));$('branchSelect').addEventListener('change',e=>loadEmployees(e.target.value));$('employeeSelect').addEventListener('change',e=>{const [code,name]=e.target.value.split('|');const row=rows.find(x=>String(x.code??'')===code&&String(x.name??'')===name&&String(x.branch||'').trim()===$('branchSelect').value);if(row)renderSlip(row);else clearSlip('لم يتم العثور على بيانات الموظف في الشهر المحدد.')});
$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.reload()});
async function imageBlob(){
 if(!selected)throw new Error('no_slip');await document.fonts.ready;
 const keys=Object.keys(labels).filter(k=>selected[k]!==undefined&&selected[k]!==null&&selected[k]!==''&&k!=='branch'&&k!=='t'&&k!=='pm');
 const width=900,pad=48,cardW=width-pad*2,rowH=82,detailStart=690,totalTop=425,totalH=138;
 const height=detailStart+keys.length*rowH+100;
 const c=document.createElement('canvas');c.width=width;c.height=height;const x=c.getContext('2d');
 x.fillStyle='#f3f6fa';x.fillRect(0,0,width,height);x.fillStyle='#17365d';x.fillRect(0,0,width,18);
 x.direction='rtl';x.textAlign='center';x.fillStyle='#17365d';x.font='700 56px Cairo';x.fillText('Alpha Ceuticals',width/2,100);x.fillStyle='#637187';x.font='700 40px Cairo';x.fillText('مفردات المرتب',width/2,165);
 x.fillStyle='#fff';x.strokeStyle='#dbe2ec';x.lineWidth=2;x.beginPath();x.roundRect(pad,205,cardW,194,22);x.fill();x.stroke();x.textAlign='right';x.fillStyle='#637187';x.font='700 29px Cairo';x.fillText('الموظف',width-pad-28,251);x.fillStyle='#17243a';x.font='700 42px Cairo';x.fillText(String(selected.name||'—'),width-pad-28,310);x.fillStyle='#637187';x.font='600 27px Cairo';x.fillText(`الكود: ${selected.code||'—'}`,width-pad-28,357);x.textAlign='left';x.fillText(`الشهر: ${monthKey}`,pad+28,251);x.textAlign='right';x.fillText(`الفرع: ${selected.branch||'—'}`,width-pad-28,384);
 x.fillStyle='#e8eef6';x.beginPath();x.roundRect(pad,totalTop,cardW,totalH,18);x.fill();x.direction='rtl';x.textAlign='center';x.fillStyle='#637187';x.font='700 30px Cairo';x.fillText('إجمالي الراتب',width/2,totalTop+49);x.fillStyle='#17365d';x.font='700 46px Cairo';x.fillText(fmt(selected.tot)+' ج.م',width/2,totalTop+108);
 x.direction='rtl';x.textAlign='right';x.fillStyle='#17365d';x.font='700 38px Cairo';x.fillText('تفاصيل المرتب',width-pad,650);
 for(let i=0;i<keys.length;i++){const cy=detailStart+i*rowH;x.fillStyle='#fff';x.strokeStyle='#dbe2ec';x.beginPath();x.roundRect(pad,cy,cardW,rowH-8,14);x.fill();x.stroke();x.direction='rtl';x.textAlign='right';x.fillStyle='#637187';x.font='700 27px Cairo';x.fillText(labels[keys[i]],width-pad-22,cy+31);x.direction='ltr';x.textAlign='left';x.fillStyle='#17243a';x.font='700 30px Cairo';const value=counts.has(keys[i])?fmt(selected[keys[i]]):fmt(selected[keys[i]])+' EGP';x.fillText(value,pad+22,cy+66)}
 x.direction='rtl';x.textAlign='center';x.fillStyle='#7a8798';x.font='600 24px Cairo';x.fillText('مفردات مرتب داخلية — Alpha Ceuticals',width/2,height-30);
 return await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('image_failed')),'image/png'))
}
async function saveImage(share){try{const blob=await imageBlob(),file=new File([blob],`payslip-${monthKey}-${selected.code||'employee'}.png`,{type:'image/png'});if(share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:`مفردات مرتب ${selected.name||''}`});return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);if(share)alert('المشاركة المباشرة غير متاحة في هذا المتصفح؛ تم تنزيل الصورة لتشاركها يدويًا.')}catch(e){if(e.name!=='AbortError')alert('تعذر تجهيز الصورة. جرّب تنزيلها مرة أخرى.');console.error(e)}}
$('downloadBtn').addEventListener('click',()=>saveImage(false));$('shareBtn').addEventListener('click',()=>saveImage(true));
(async()=>{const {data:{session}}=await db.auth.getSession();if(session)await showApp()})();
</script>
</body></html>
